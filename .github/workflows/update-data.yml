name: Update contribution data

# Auto-updates public/data/contributions.json from the GitHub API, rebuilds the
# app, captures a fresh preview.png of the rendered nebula, then commits both
# back. GitHub Pages redeploys automatically from the deploy workflow.

on:
  schedule:
    # Daily at 04:17 UTC. Off-the-hour to avoid GitHub's scheduling congestion.
    - cron: "17 4 * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Minimal permissions: this job only needs to write the committed data file.
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch contribution data
        env:
          # GITHUB_TOKEN is provided automatically by Actions and is scoped to
          # this repo only. It can read your PUBLIC contribution calendar.
          # To include PRIVATE contributions, create a fine-grained PAT with
          # read-only "Contributions" + "Metadata" access, store it as the
          # repo secret CONSTELLATION_TOKEN, and it will be used instead.
          GITHUB_TOKEN: ${{ secrets.CONSTELLATION_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
          # Optional: comma-separated repo names to turn into named
          # constellations. Leave unset to auto-pick your top repos.
          PROJECT_REPOS: ${{ vars.PROJECT_REPOS }}
        run: node scripts/fetch-contributions.mjs

      - name: Build the app
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture preview screenshot
        run: node scripts/screenshot.mjs

      - name: Commit updated data and preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ public/preview.png
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update contribution data + preview [skip ci]"
            git push
          fi
