name: Deploy to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages. Runs on every push to
# main (including the data-update bot's commits) and can be triggered manually.

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Also deploy after the nightly data-update job finishes.
  # workflow_run fires even when the triggering commit contains [skip ci],
  # so this is the only reliable way to redeploy after a data update
  # (GITHUB_TOKEN pushes do not re-trigger sibling workflows by design).
  workflow_run:
    workflows: ["Update contribution data"]
    types: [completed]
    branches: [main]

# Minimal permissions for Pages deployment via the official flow.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # When triggered by workflow_run, only deploy if the upstream job succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure data file exists
        # If the data-update job hasn't run yet, fall back to mock data so the
        # first deploy still renders something.
        run: |
          if [ ! -f public/data/contributions.json ]; then
            echo "No data file found; generating mock data for first deploy."
            node scripts/generate-mock.mjs
          fi

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
